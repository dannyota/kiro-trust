name: Release preflight
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo install cargo-auditable cargo-cyclonedx --locked
      - run: cargo publish --workspace --dry-run --locked
      - run: cargo auditable build --release --locked -p kiro-trust
      - run: cargo cyclonedx --workspace --format json
