[package]
name = "kiro-trust-tests"
description = "Fixture, security, server, and live tests for kiro-trust. Not published."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kiro-trust-protocol.workspace = true
kiro-trust-net = { workspace = true, features = ["test-endpoints"] }
kiro-trust-auth.workspace = true
kiro-trust-kiro.workspace = true
kiro-trust.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "test-util"] }
wiremock.workspace = true
tempfile.workspace = true
rusqlite = { version = "0.40.2", features = ["bundled"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "std"] }
http.workspace = true
bytes.workspace = true
futures-util.workspace = true
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.5"
httpdate = "1.0.3"
secrecy.workspace = true
async-trait = "0.1.92"
