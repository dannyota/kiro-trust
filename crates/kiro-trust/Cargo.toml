[package]
name = "kiro-trust"
description = "Security-first local trust proxy for using Claude Code with Kiro and AWS IAM Identity Center credentials."
publish = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
default-run = "kiro-trust"

[features]
# Developer-only payload capture (spec 8.3). Never in release builds.
capture = []

[dependencies]
kiro-trust-protocol.workspace = true
kiro-trust-net.workspace = true
kiro-trust-auth.workspace = true
kiro-trust-kiro.workspace = true
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net", "fs"] }
tokio-stream = "0.1.19"
clap = { version = "4.6.6", features = ["derive", "env"] }
serde.workspace = true
serde_json.workspace = true
secrecy.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "std"] }
http.workspace = true
bytes.workspace = true
futures-util.workspace = true
uuid.workspace = true
getrandom = "0.4.3"
base64 = "0.23.1"
directories = "6.0.0"
subtle = "2.6"
time = { version = "0.3.55", features = ["formatting"] }

# Unix only, and only for one call: reinstating SIG_IGN on SIGPIPE after a
# failed `exec` in `exec_cmd::run`, which leaves the default disposition
# behind and would otherwise make that failure path exit 141 instead of 1
# (spec 4.5). Already compiled into this binary transitively through
# `directories`, so declaring it adds an explicit edge, not new code.
[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[dev-dependencies]
tempfile.workspace = true
# Test-only: builds the synthetic audit-gate database inside
# `#[cfg(test)] mod tests` in src/audit.rs. Never a [dependencies] entry
# (task-20-rulings.md ruling 2); CLAUDE.md: the Kiro database is opened only
# through KiroDb::open_read_only.
rusqlite = { version = "0.40.2", features = ["bundled"] }
